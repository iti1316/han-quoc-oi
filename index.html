/* ────────────────────────────────────────────────────────────
   🔒 렌더 레이어 익명화 — 2중 보안
   저장된 author 값이 허용 패턴과 다르면 (예: 실제 이름·ID가
   미래 백엔드에서 흘러들어올 경우) post.id 기반으로 덮어씁니다.
   화면에는 절대 실제 개인정보가 표시되지 않습니다.
──────────────────────────────────────────────────────────── */
const ANON_PATTERN = new RegExp(`^(${ANONS.join('|')}) #\\d{3}$`);

/** author 필드를 안전한 익명 닉네임으로 보장 */
function safeAuthor(post) {
  // 커스텀 닉네임인 경우: ANON_PATTERN 패턴이 없으면 그대로 반환
  if (!ANON_PATTERN.test(post.author)) {
    // 숫자로만 이루어진 경우(post.id 기반) → 재생성
    if (/^\d+$/.test(post.author)) {
      const seed = Math.abs(typeof post.id === 'number' ? post.id : parseInt(post.id, 10) || 1);
      return `${ANONS[seed % ANONS.length]} #${(seed % 900) + 100}`;
    }
    // 그 외: 커스텀 닉네임 → 그대로 반환
    return post.author;
  }
  // ANON_PATTERN 형식 → 그대로 반환
  return post.author;
}
/** 아바타 문자: author 첫 글자 대신 post.id 기반으로 고정 */
function safeAvatarChar(post) {
  const author = safeAuthor(post);
  const seed = Math.abs((author.charCodeAt(0) || 0) + (author.charCodeAt(1) || 0));
  return ['익','D','V','하','H','버','A','B'][seed % 8];
}
/** 아바타 색상: author(닉네임) 기반 결정론적 색상 (같은 닉네임은 항상 같은 색상) */
function safeAvatarColor(post) {
  const author = safeAuthor(post);
  const seed = Math.abs((author.charCodeAt(0) || 0) + (author.charCodeAt(1) || 0));
  return AVATAR_COLORS[seed % AVATAR_COLORS.length];
}

/* ── 커스텀 훅: 게시글 (LocalStorage) ──────────────────────── */
function usePosts() {
  const deviceId = getDeviceId();
  const [posts, setPosts] = useState(() => {
    try {
      const stored = JSON.parse(localStorage.getItem(BOARD_STORE));
      if (!stored) return defaultPosts();
      return stored.map(p => ({
        ...p,
        isPublic: p.isPublic !== undefined ? p.isPublic : true
      }));
    }
    catch { return defaultPosts(); }
  });
  const save = (next) => {

    setPosts(next);

    // localStorage 사용 (fallback용, file:// 프로토콜에서는 제한될 수 있음)
    try {
      localStorage.setItem(BOARD_STORE, JSON.stringify(next));
      console.log('💾 LocalStorage saved - 첫 글 author:', next[0]?.author);
    } catch (e) {
      console.warn('⚠️ LocalStorage 사용 불가:', e.message);
    }

    // Firebase REST API로 저장 (메인 저장소)
    console.log('🌐 Sending to Firebase...');
    fetch(FIREBASE_POSTS_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(next),
      timeout: 10000
    })
      .then(res => {
        console.log('📡 Firebase response:', res.status);
        if (res.ok) {
          console.log('✅ Firebase save success');
          return res.json();
        } else {
          throw new Error(`Firebase error: ${res.statusText}`);
        }
      })
      .catch(e => {
        console.error('❌ Firebase save failed:', e.message);
        console.warn('⚠️ 로컬 데이터는 저장됨. 다음 새로고침 시 firebase와 동기화됨.');
      });
  };
  const addPost    = (p)         => {
    console.log('🟢 [addPost] 받은 post:', p);
    console.log('🟢 [addPost] post.author:', p.author);
    console.log('🟢 [addPost] 현재 posts 배열 길이:', posts.length);
    const newPostsArray = [p, ...posts];
    console.log('🟢 [addPost] 새 배열의 첫 번째 글:', newPostsArray[0]);
    save(newPostsArray);
  };
  const deletePost = (id)        => save(posts.filter(p => p.id !== id));
  const updatePost = (id, edits) => save(posts.map(p => p.id === id ? { ...p, ...edits } : p));
  const canEditPost = (p) => p.deviceId === deviceId;

  // Firebase REST API에서 데이터 불러오기
  useEffect(() => {
    fetch(FIREBASE_POSTS_URL, { timeout: 10000 })
      .then(res => res.json())
      .then(data => {
        // 데이터 검증: null 체크, 배열 확인, 각 항목 검증
        if (!data) {
          console.log('✅ Firebase: 데이터 없음 (초기 상태)');
          return;
        }

        if (!Array.isArray(data)) {
          console.warn('⚠️ Firebase 데이터가 배열이 아님:', typeof data);
          return;
        }

        // 각 항목 검증 (id와 author 필수)
        const validData = data.filter(p => p && p.id != null && p.author);
        console.log(`✅ Firebase load: ${data.length}개 중 ${validData.length}개 유효`);

        setPosts(prev => {
          // id를 string으로 정규화해서 비교 (안전성 향상)
          const localOnly = prev.filter(p =>
            !validData.some(fb => String(fb.id) === String(p.id))
          );

          const merged = [...localOnly, ...validData];
          console.log('✅ Firebase load success - merged:', localOnly.length, 'local posts preserved');

          // localStorage 업데이트 시도 (실패해도 괜찮음)
          try {
            localStorage.setItem(BOARD_STORE, JSON.stringify(merged));
          } catch (e) {
            console.warn('⚠️ Firebase로드 후 localStorage 업데이트 실패');
          }

          return merged;
        });
      })
      .catch(e => {
        console.error('❌ Firebase load error:', e.message);
        console.log('💡 로컬 데이터 사용 중. 다음 저장 시 firebase와 동기화됩니다.');
      });
  }, []);

  function addComment(postId, comment) {
    save(posts.map(p => {
      if (p.id !== postId) return p;
      const list = [...(p.commentsData || []), { ...comment, deviceId }];
      return { ...p, commentsData: list, comments: list.length };
    }));
  }
  function deleteComment(postId, commentId) {
    save(posts.map(p => {
      if (p.id !== postId) return p;
      const list = (p.commentsData || []).filter(c => c.id !== commentId);
      return { ...p, commentsData: list, comments: list.length };
    }));
  }
  function updateComment(postId, commentId, edits) {
    save(posts.map(p => {
      if (p.id !== postId) return p;
      const list = (p.commentsData || []).map(c => c.id === commentId ? { ...c, ...edits } : c);
      return { ...p, commentsData: list };
    }));
  }

  return { posts, addPost, deletePost, updatePost, addComment, deleteComment, updateComment, canEditPost, deviceId };
}

function CommentSection({ post, lang, onAddComment, onDeleteComment, onUpdateComment, deviceId }) {
  const L = LANG[lang];
  const SHOW_INITIAL = 10;

  const [comments, setComments] = useState(post.commentsData || []);
  const [body, setBody]       = useState('');
  const [delModal, setDelModal] = useState(null);
  const [editModal, setEditModal] = useState(null);
  const [editBody, setEditBody] = useState('');
  const [showAllComments, setShowAllComments] = useState(false);

  // post.commentsData 변경 시 동기화
  useEffect(() => {
    setComments(post.commentsData || []);
  }, [post.id, post.commentsData?.length]);

  function submit() {
    if (!body.trim()) return;
    const newComment = {
      id:     Date.now(),
      author: genAuthor(),
      date:   new Date().toLocaleDateString('ko-KR'),
      body:   body.trim(),
      deviceId: deviceId,
    };
    setComments([...comments, newComment]);
    setBody('');
    onAddComment(post.id, newComment);
  }

  function handleDelete(c) {
    if (c.deviceId !== deviceId) { alert(lang==='vi'?'Chỉ có thể xóa bình luận của chính bạn':'자신의 댓글만 삭제할 수 있습니다'); return; }
    const newComments = comments.filter(cmt => cmt.id !== c.id);
    setComments(newComments);
    onDeleteComment(post.id, c.id);
  }

  function handleEditStart(c) {
    if (c.deviceId !== deviceId) { alert(lang==='vi'?'Chỉ có thể sửa bình luận của chính bạn':'자신의 댓글만 수정할 수 있습니다'); return; }
    setEditModal(c);
    setEditBody(c.body);
  }

  function handleEditSave() {
    if (!editModal || !editBody.trim()) return;
    const newComments = comments.map(c =>
      c.id === editModal.id ? { ...c, body: editBody.trim() } : c
    );
    setComments(newComments);
    onUpdateComment(post.id, editModal.id, { body: editBody.trim() });
    setEditModal(null);
    setEditBody('');
  }

  const displayComments = showAllComments ? comments : comments.slice(0, SHOW_INITIAL);
  const hiddenCount = Math.max(0, comments.length - SHOW_INITIAL);

  return (
    <div className="border-t border-gray-100 bg-gray-50">
      {/* 댓글 목록 */}
      {comments.length === 0 ? (
        <p className="text-xs text-gray-400 text-center py-4">{L.cmtEmpty}</p>
      ) : (
        <>
          <ul className="divide-y divide-gray-100">
            {displayComments.map(c => (
              <li key={c.id} className="flex items-start gap-2.5 px-4 py-3">
                <div className={`w-7 h-7 rounded-full ${safeAvatarColor(c)} flex items-center justify-center text-white text-xs font-black flex-shrink-0`}>
                  {safeAvatarChar(c)}
                </div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 mb-0.5">
                    <p className="text-[11px] font-bold text-gray-700">{c.author}</p>
                    <p className="text-[10px] text-gray-400">{c.date}</p>
                    {c.deviceId === deviceId && (
                      <div className="ml-auto flex gap-1">
                        <button onClick={() => handleEditStart(c)}
                          className="text-[10px] text-blue-400 hover:text-blue-600 border border-blue-100 hover:border-blue-300 px-1.5 py-0.5 rounded tap transition">
                          {lang==='vi'?'Sửa':'수정'}
                        </button>
                        <button onClick={() => handleDelete(c)}
                          className="text-[10px] text-red-400 hover:text-red-600 border border-red-100 hover:border-red-300 px-1.5 py-0.5 rounded tap transition">
                          {L.cmtDelete}
                        </button>
                      </div>
                    )}
                  </div>
                  <p className="text-xs text-gray-600 word-keep leading-relaxed">{c.body}</p>
                </div>
              </li>
            ))}
          </ul>

          {/* 더보기 버튼 */}
          {hiddenCount > 0 && !showAllComments && (
            <button onClick={() => setShowAllComments(true)}
              className="w-full py-2.5 text-center text-xs font-bold text-blue-600 hover:bg-blue-50 border-t border-gray-100 tap transition">
              💬 {lang==='vi'?`Xem thêm ${hiddenCount} bình luận`:`댓글 ${hiddenCount}개 더보기`}
            </button>
          )}
        </>
      )}

      {/* 댓글 작성 폼 */}
      <div className="px-4 pb-4 pt-2">
        <textarea
          value={body}
          onChange={e => setBody(e.target.value)}
          placeholder={L.cmtPlaceholder}
          rows={2}
          className="w-full text-xs text-gray-700 border border-gray-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-blue-400 placeholder-gray-300 resize-none leading-relaxed"
        />
        <button
          onClick={submit}
          disabled={!body.trim()}
          className="w-full mt-2 px-4 py-2.5 bg-blue-700 text-white text-xs font-black rounded-xl disabled:opacity-40 tap transition">
          {L.cmtSubmit}
        </button>
        <p className="text-[10px] text-gray-300 mt-1.5">{lang==='vi'?'💡 Bình luận của bạn sẽ được xác định bằng thiết bị này':'💡 댓글은 이 기기에서만 수정/삭제 가능합니다'}</p>
      </div>

      {/* 댓글 수정 텍스트 모달 */}
      {editModal && (
        <div className="fixed inset-0 bg-black/60 z-50 flex items-end justify-center fade-in" onClick={() => setEditModal(null)}>
          <div className="bg-white rounded-t-3xl w-full max-w-lg px-6 pt-6 pb-10 shadow-2xl" onClick={e=>e.stopPropagation()}>
            <div className="w-10 h-1 bg-gray-200 rounded-full mx-auto mb-5"></div>
            <p className="text-sm font-black text-gray-800 mb-3">{lang==='vi'?'Sửa bình luận':'댓글 수정'}</p>
            <textarea
              value={editBody}
              onChange={e => setEditBody(e.target.value)}
              placeholder={L.cmtPlaceholder}
              rows={3}
              className="w-full text-xs text-gray-700 border border-gray-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-blue-400 placeholder-gray-300 resize-none leading-relaxed mb-3"
            />
            <div className="grid grid-cols-2 gap-2">
              <button onClick={() => setEditModal(null)}
                className="py-3.5 border border-gray-200 rounded-2xl text-sm font-bold text-gray-500 bg-white tap transition">
                {lang==='vi'?'Hủy':'취소'}
              </button>
              <button onClick={handleEditSave}
                disabled={!editBody.trim()}
                className="py-3.5 bg-blue-700 text-white rounded-2xl text-sm font-black tap transition disabled:opacity-40">
                {lang==='vi'?'Lưu':'저장'}
              </button>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

/* 게시글 카드 */
function PostCard({ post, lang = 'vi', onDelete, onEdit, onAddComment, onDeleteComment, onUpdateComment, deviceId }) {
  const [r, setR]           = useState({ likes:post.likes, hearts:post.hearts, wows:post.wows });
  const [act, setAct]       = useState(null);
  const [modal, setModal]   = useState(null);
  const [unlocked, setUnlocked] = useState(false);
  const [showCmt, setShowCmt]   = useState(false);
  const L = LANG[lang];

  // post 반응 카운트 동기화
  useEffect(() => {
    setR({ likes: post.likes||0, hearts: post.hearts||0, wows: post.wows||0 });
  }, [post.id, post.likes, post.hearts, post.wows]);

  function react(type) {
    const same = act === type;
    setR(p => {
      const n = { ...p };
      if (same) { n[type] = Math.max(0, n[type]-1); }
      else { if (act) n[act] = Math.max(0, n[act]-1); n[type]++; }
      return n;
    });
    setAct(same ? null : type);
  }

  function handleAction() {
    if (modal === 'delete') {
      setModal(null);
      onDelete && onDelete(post.id);
    } else if (modal === 'edit') {
      setModal(null);
      onEdit && onEdit(post);
    }
  }

  /* ── 비공개 글: 잠금 화면 (비번 입력하면 열람 가능) ── */
  if (post.isPublic !== true && !unlocked) {
    return (
      <>
        <div className="bg-white rounded-2xl shadow-sm overflow-hidden mb-3 border border-gray-100 fade-in">
          <div className="px-4 py-4">

      {/* 댓글 섹션 */}

                className="py-3.5 bg-red-600 text-white rounded-2xl text-sm font-black tap transition">
                {lang==='vi'?'Xóa':'삭제'}

}

/* ================================================================
   자유 토크방 — 리액션 미니 버튼 (아코디언 상세 내에서 사용)
================================================================ */
function TalkReaction({ post, lang }) {
  const [r, setR]   = useState({ likes:post.likes||0, hearts:post.hearts||0, wows:post.wows||0 });
  const [act, setAct] = useState(null);

  // post 반응 카운트 동기화
  useEffect(() => {
    setR({ likes: post.likes||0, hearts: post.hearts||0, wows: post.wows||0 });
  }, [post.id, post.likes, post.hearts, post.wows]);
  const ITEMS = [
    { t:'likes',  i:'👍', vi:'Thích',    ko:'좋아요',  on:'text-blue-600' },
    { t:'hearts', i:'❤️', vi:'Tuyệt',    ko:'최고예요', on:'text-red-500' },
    { t:'wows',   i:'😮', vi:'Wow',      ko:'놀라워요', on:'text-amber-500' },
  ];
  function react(t) {
    const same = act === t;
    setR(p => {
      const n = { ...p };
      if (same) n[t] = Math.max(0, n[t]-1);
      else { if (act) n[act] = Math.max(0, n[act]-1); n[t]++; }
      return n;
    });
    setAct(same ? null : t);
  }
  return (
    <div className="flex gap-1.5">
      {ITEMS.map(b => (
        <button key={b.t} onClick={() => react(b.t)}
          className={`flex items-center gap-0.5 text-[10px] px-2 py-1 rounded-lg border tap transition
            ${act===b.t ? `${b.on} bg-opacity-10 border-current` : 'text-gray-400 border-gray-200 hover:bg-gray-50'}`}>
          <span>{b.i}</span>
          <span className="font-bold">{r[b.t] > 0 ? r[b.t] : (lang==='vi' ? b.vi : b.ko)}</span>
        </button>
      ))}
    </div>
  );
}

/* ================================================================
   자유 토크방 — 네이버 카페 스타일 리스트 뷰
================================================================ */
function TalkListView({ posts, nav, lang, onDeletePost, onUpdatePost, onAddComment, onDeleteComment, onUpdateComment, deviceId, onClose }) {
  const TALK_REPORTS = 'vb_talk_reports';
  const [selected, setSelected] = useState(null);
  const [reported, setReported] = useState(() => {
    try { return JSON.parse(localStorage.getItem(TALK_REPORTS) || '[]'); }
    catch { return []; }
  });
  const [pwModal, setPwModal]   = useState(null); // { action:'edit'|'delete'|'view', post }
  const [viewUnlocked, setViewUnlocked] = useState([]); // 비공개 열람 완료 id 배열
  const L = LANG[lang];

  const talkPosts = posts.filter(p => p.cat === 'talk');

  function doReport(id) {
    if (reported.includes(id)) return;
    const next = [...reported, id];
    setReported(next);
    localStorage.setItem(TALK_REPORTS, JSON.stringify(next));
    if (selected === id) setSelected(null);
  }

  function handlePwConfirm(pw, onFail) {
    if (!pwModal) return;
    const { action, post } = pwModal;
    if (!post.pw || pw !== post.pw) { onFail(); return; }
    setPwModal(null);
    if (action === 'delete') {
      if (selected === post.id) setSelected(null);
      onDeletePost && onDeletePost(post.id);
    } else if (action === 'edit') {

    } else if (action === 'view') {
      setViewUnlocked(prev => [...prev, post.id]);
    }

    <div className="fade-in">
      {/* 토크방 서브 헤더 */}

          <div className="flex items-center gap-2">
            <span className="w-2.5 h-2.5 bg-green-500 rounded-full inline-block" style={{boxShadow:'0 0 0 3px rgba(34,197,94,.2)'}}></span>
            <div>
              <p className="text-sm font-black text-gray-800">
                {lang === 'vi' ? 'Góc Tán Gẫu' : '🟢 자유 토크방'}
              </p>
              <p className="text-[10px] text-gray-400">
                {lang === 'vi' ? 'Tán gẫu tự do · Không liên quan đến visa' : '비자 외 자유 수다 · 일상 토크'}
              </p>
            </div>
          </div>
          <div className="flex items-center gap-2 flex-shrink-0">
            <button onClick={() => nav({ page:'write', param:'talk' })}
              className="text-xs font-black text-white bg-green-600 hover:bg-green-700 px-3 py-2 rounded-full shadow-sm tap transition">
              {L.talkWriteBtn}
            </button>
            <button onClick={onClose}
              className="text-[11px] font-bold text-gray-500 bg-gray-100 hover:bg-gray-200 px-3 py-2 rounded-full tap transition">
              {L.talkClose} ✕
            </button>
          </div>
        </div>
      </div>

      {/* 게시글 리스트 */}
      <div className="max-w-lg mx-auto mt-2 bg-white shadow-sm overflow-hidden rounded-t-2xl">
        {/* 테이블 헤더 */}
        <div className="grid gap-2 px-4 py-2.5 bg-gray-50 border-b border-gray-100"
          style={{gridTemplateColumns:'2rem 1fr 4.5rem 3.5rem'}}>
          <p className="text-[10px] font-black text-gray-400 text-center">No.</p>
          <p className="text-[10px] font-black text-gray-400">{L.talkColTitle}</p>
          <p className="text-[10px] font-black text-gray-400 text-center">{L.talkColAuthor}</p>
          <p className="text-[10px] font-black text-gray-400 text-right">{L.talkColDate}</p>
        </div>

        {talkPosts.length === 0 ? (
          <div className="text-center py-14">
            <p className="text-4xl mb-3">💬</p>
            <p className="text-sm text-gray-400 word-keep">{L.talkEmpty}</p>
          </div>
        ) : (
          <ul className="divide-y divide-gray-100">
            {talkPosts.map((p, idx) => {
              const num       = talkPosts.length - idx;
              const isBlinded = reported.includes(p.id);
              const isOpen    = selected === p.id;
              const isUnlocked = viewUnlocked.includes(p.id);
              const isPrivate = p.isPublic !== true;
              const showBody  = !isPrivate || isUnlocked;

              return (
                <li key={p.id}>
                  {/* ─ 한 줄 행 ─ */}
                  <div
                    onClick={() => !isBlinded && setSelected(isOpen ? null : p.id)}

                      ${isBlinded ? 'opacity-40 cursor-default' : ''}`}
                    style={{gridTemplateColumns:'2rem 1fr 4.5rem 3.5rem'}}>
                    {/* No. */}
                    <p className={`text-[11px] font-black text-center self-center
                      ${p.isNew ? 'text-red-500' : 'text-gray-400'}`}>
                      {p.isNew ? 'N' : num}
                    </p>
                    {/* 제목 */}
                    <div className="min-w-0 self-center">
                      {isBlinded ? (
                        <p className="text-[11px] text-gray-300 italic">{L.talkBlinded}</p>
                      ) : isPrivate && !isUnlocked ? (
                        <p className="text-[11px] text-gray-400 italic">{L.talkPrivate}</p>
                      ) : (
                        <p className={`text-[11px] font-medium truncate word-keep
                          ${isOpen ? 'text-green-700 font-black' : 'text-gray-800'}`}>

                    {/* 작성자 */}
                    <p className="text-[10px] text-gray-400 text-center self-center truncate">
                      {safeAuthor(p).replace(/ #\d+$/, '')}

                    {/* 날짜 */}
                    <p className="text-[10px] text-gray-400 text-right self-center whitespace-nowrap">
                      {p.date.slice(5)}

                  </div>

                  {/* ─ 아코디언 상세 ─ */}
                  {isOpen && (
                    <div className="bg-green-50 border-t border-green-100 px-4 py-4 fade-in">
                      {/* 비공개 잠금 상태 */}
                      {isPrivate && !isUnlocked ? (
                        <div className="flex flex-col items-center gap-3 py-4">
                          <span className="text-3xl">🔒</span>
                          <p className="text-xs text-gray-500 text-center word-keep">

                          </p>
                          {p.pw && (
                            <button onClick={()=>setPwModal({action:'view', post:p})}
                              className="text-xs font-black text-blue-600 bg-blue-50 border border-blue-200 px-4 py-2 rounded-xl tap">
                              🔑 {lang==='vi' ? 'Nhập mật khẩu' : '비밀번호 입력'}
                            </button>
                          )}
                        </div>
                      ) : (
                        <>
                          {/* 작성자 정보 */}
                          <div className="flex items-center gap-2 mb-3">
                            <div className={`w-7 h-7 rounded-full ${safeAvatarColor(p)} flex items-center justify-center text-white text-xs font-black flex-shrink-0`}>
                              {safeAvatarChar(p)}
                            </div>
                            <div className="flex-1">
                              <p className="text-xs font-bold text-gray-700">{safeAuthor(p)}</p>
                              <p className="text-[10px] text-gray-400">{p.date}</p>
                            </div>
                            {isPrivate && isUnlocked && (
                              <span className="text-[9px] font-black text-white bg-gray-400 px-1.5 py-0.5 rounded-full">🔒 비공개</span>
                            )}
                            {isUnlocked && (
                              <button onClick={() => setViewUnlocked(v => v.filter(id => id !== p.id))}
                                className="text-[9px] text-gray-400 border border-gray-200 px-1.5 py-0.5 rounded-full tap">
                                🔒
                              </button>
                            )}
                          </div>
                          {/* 본문 */}
                          <p className="text-xs text-gray-700 leading-relaxed word-keep mb-3">{p.body}</p>
                          {/* 리액션 + 수정/삭제/신고 */}
                          <div className="flex items-center gap-2 flex-wrap">
                            <TalkReaction post={p} lang={lang} />
                            <div className="flex gap-1.5 ml-auto">
                              {p.pw && (
                                <>
                                  <button onClick={()=>setPwModal({action:'edit', post:p})}
                                    className="text-[10px] text-blue-500 border border-blue-200 px-2 py-1 rounded-lg hover:bg-blue-50 tap">
                                    {L.editBtn}
                                  </button>
                                  <button onClick={()=>setPwModal({action:'delete', post:p})}

                            </div>
                          </div>
                          {/* 댓글 섹션 */}
                          <div className="mt-3 -mx-4 -mb-4">
                            <CommentSection

                              onUpdateComment={onUpdateComment}

                          </div>

                      )}

          </ul>
        )}
      </div>

      {/* 비밀번호 모달 */}
      {pwModal && (

  );

      </div>

      {/* 테이블 헤더 */}
      <div className="bg-white shadow-sm overflow-hidden">
        <div className="grid gap-2 px-4 py-2 bg-gray-50 border-b border-gray-100"
          style={{gridTemplateColumns:'3rem 1fr 4.5rem 3.5rem'}}>
          <p className="text-[10px] font-black text-gray-400 text-center">
            {lang==='vi' ? 'Loại' : '분류'}
          </p>
          <p className="text-[10px] font-black text-gray-400">
            {lang==='vi' ? 'Tiêu đề' : '제목'}
          </p>
          <p className="text-[10px] font-black text-gray-400 text-center">
            {lang==='vi' ? 'Tác giả' : '작성자'}
          </p>
          <p className="text-[10px] font-black text-gray-400 text-right">
            {lang==='vi' ? 'Ngày' : '날짜'}
          </p>
        </div>

        {displayPosts.length === 0 ? (
          <div className="text-center py-14">
            <p className="text-4xl mb-3">📭</p>
            <p className="text-sm text-gray-400 word-keep">{L.visaBoardEmpty}</p>
          </div>
        ) : (
          <ul className="divide-y divide-gray-100">
            {displayPosts.map((p) => {
              const isBlinded  = reported.includes(p.id);
              const isOpen     = selected === p.id;
              const isUnlocked = viewUnlocked.includes(p.id);
              const isPrivate  = p.isPublic !== true;
              const badge      = CAT_BADGE[p.cat];
              return (
                <li key={p.id}>
                  {/* ─ 한 줄 행 ─ */}
                  <div
                    onClick={() => !isBlinded && setSelected(isOpen ? null : p.id)}
                    className={`grid gap-2 px-4 py-3 cursor-pointer transition
                      ${isOpen ? 'bg-blue-50' : 'hover:bg-gray-50'}
                      ${isBlinded ? 'opacity-40 cursor-default' : ''}`}
                    style={{gridTemplateColumns:'3rem 1fr 4.5rem 3.5rem'}}>
                    {/* 분류 배지 */}
                    <div className="flex justify-center items-center">
                      <span className={`text-[9px] font-black px-1.5 py-0.5 rounded-full ${badge.bg} ${badge.text}`}>
                        {badge.emoji}
                      </span>
                    </div>
                    {/* 제목 */}
                    <div className="min-w-0 self-center">
                      {isBlinded ? (
                        <p className="text-[11px] text-gray-300 italic">{L.talkBlinded}</p>
                      ) : isPrivate && !isUnlocked ? (
                        <p className="text-[11px] text-gray-400 italic">🔒 {lang==='vi' ? 'Bài riêng tư' : '비공개 글'}</p>
                      ) : (
                        <p className={`text-[11px] font-medium truncate word-keep
                          ${isOpen ? 'text-blue-700 font-black' : 'text-gray-800'}`}>
                          {p.isNew && <span className="text-[9px] font-black text-red-500 mr-1">N</span>}
                          {p.title}
                        </p>
                      )}
                    </div>
                    {/* 작성자 */}
                    <p className="text-[10px] text-gray-400 text-center self-center truncate">
                      {safeAuthor(p).replace(/ #\d+$/, '')}
                    </p>
                    {/* 날짜 */}
                    <p className="text-[10px] text-gray-400 text-right self-center whitespace-nowrap">
                      {p.date.slice(5)}
                    </p>
                  </div>

                  {/* ─ 아코디언 상세 ─ */}
                  {isOpen && (
                    <div className={`border-t border-gray-100 px-4 py-4 fade-in ${badge.bg}`}>
                      {isPrivate && !isUnlocked ? (
                        <div className="flex flex-col items-center gap-3 py-4">
                          <span className="text-3xl">🔒</span>
                          <p className="text-xs text-gray-500 text-center word-keep">
                            {lang==='vi' ? 'Bài viết riêng tư. Nhập mật khẩu để xem.' : '비공개 글입니다. 비밀번호를 입력해주세요.'}
                          </p>
                          {p.pw && (
                            <button onClick={() => setPwModal({action:'view', post:p})}
                              className="text-xs font-black text-blue-600 bg-white border border-blue-200 px-4 py-2 rounded-xl tap">
                              🔑 {lang==='vi' ? 'Nhập mật khẩu' : '비밀번호 입력'}
                            </button>
                          )}
                        </div>
                      ) : (
                        <>
                          {/* 작성자 정보 */}
                          <div className="flex items-center gap-2 mb-3">
                            <div className={`w-7 h-7 rounded-full ${safeAvatarColor(p)} flex items-center justify-center text-white text-xs font-black flex-shrink-0`}>
                              {safeAvatarChar(p)}
                            </div>
                            <div className="flex-1">
                              <p className="text-xs font-bold text-gray-700">{safeAuthor(p)}</p>
                              <p className="text-[10px] text-gray-400">{p.date}</p>
                            </div>
                            <span className={`text-[9px] font-black px-2 py-0.5 rounded-full bg-white/70 ${badge.text}`}>
                              {badge.emoji} {lang==='vi' ? badge.vi : badge.ko}
                            </span>
                          </div>
                          {/* 본문 */}
                          <p className="text-xs text-gray-700 leading-relaxed word-keep mb-3">{p.body}</p>
                          {/* 리액션 + 수정/삭제/신고 */}
                          <div className="flex items-center gap-2 flex-wrap">
                            <TalkReaction post={p} lang={lang} />
                            <div className="flex gap-1.5 ml-auto">
                              {p.pw && (
                                <>
                                  <button onClick={() => setPwModal({action:'edit', post:p})}
                                    className="text-[10px] text-blue-500 border border-blue-200 bg-white/70 px-2 py-1 rounded-lg hover:bg-white tap">
                                    {L.editBtn}
                                  </button>
                                  <button onClick={() => setPwModal({action:'delete', post:p})}
                                    className="text-[10px] text-red-500 border border-red-200 bg-white/70 px-2 py-1 rounded-lg hover:bg-white tap">
                                    {L.deleteBtn}
                                  </button>
                                </>
                              )}
                              <button onClick={() => doReport(p.id)}
                                className={`text-[10px] px-2 py-1 rounded-lg border tap
                                  ${reported.includes(p.id)
                                    ? 'text-gray-300 border-gray-100 cursor-default'
                                    : 'text-orange-500 border-orange-200 bg-white/70 hover:bg-white'}`}>
                                🚩 {reported.includes(p.id) ? L.talkReported : L.talkReport}
                              </button>
                            </div>
                          </div>
                          {/* 댓글 섹션 */}
                          <div className="mt-3 -mx-4 -mb-4">
                            <CommentSection
                              post={p} lang={lang}
                              onAddComment={onAddComment}
                              onDeleteComment={onDeleteComment}
                              onUpdateComment={onUpdateComment}
                              deviceId={deviceId} />
                          </div>
                        </>
                      )}
                    </div>
                  )}
                </li>
              );
            })}
          </ul>
        )}
      </div>

      {pwModal && (
        <PwModal lang={lang} onConfirm={handlePwConfirm} onCancel={() => setPwModal(null)} />
      )}
    </div>
  );
}

function loadNotices() {
  try {
    const raw = localStorage.getItem(NOTICE_STORE);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return DEFAULT_NOTICES;
}
function saveNotices(arr) {
  localStorage.setItem(NOTICE_STORE, JSON.stringify(arr));
}

/* ── 관리자 공지 편집 모달 ── */
function NoticeAdminModal({ notices, lang, onSave, onClose }) {
  const [list, setList] = useState(notices.map(n => ({ ...n })));

  function update(idx, field, val) {
    setList(prev => prev.map((n, i) => i === idx ? { ...n, [field]: val } : n));
  }
  function addNotice() {
    const newId = Math.max(...list.map(n => n.id), 0) + 1;
    setList(prev => [...prev, { id: newId, urgent: false, date: new Date().toLocaleDateString('ko-KR').replace(/\. /g,'.').replace('.',''), ko: '', vi: '' }]);
  }
  function removeNotice(idx) {
    if (list.length <= 1) return alert('공지는 최소 1개 이상 있어야 합니다.');
    setList(prev => prev.filter((_,i) => i !== idx));
  }

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center" onClick={onClose}>
      <div className="absolute inset-0 bg-black/60" />
      <div
        className="relative w-full max-w-lg bg-white rounded-t-2xl px-4 pt-5 pb-8 fade-in overflow-y-auto max-h-[85vh]"
        onClick={e => e.stopPropagation()}
      >
        <div className="flex items-center justify-between mb-4">
          <h2 className="text-base font-black text-gray-800">🔧 공지 관리</h2>
          <button onClick={onClose} className="text-gray-400 text-xl font-bold">✕</button>
        </div>

        {list.map((n, i) => (
          <div key={n.id} className="mb-4 bg-gray-50 rounded-xl p-3 border border-gray-200">
            <div className="flex items-center justify-between mb-2">
              <span className="text-xs font-bold text-gray-500">공지 {i+1}</span>
              <div className="flex items-center gap-2">
                <label className="flex items-center gap-1 text-xs text-red-500 font-bold cursor-pointer">
                  <input type="checkbox" checked={n.urgent} onChange={e => update(i,'urgent',e.target.checked)} className="w-3 h-3" />
                  중요
                </label>
                <button onClick={() => removeNotice(i)} className="text-red-400 text-xs font-bold tap">삭제</button>
              </div>
            </div>
            <input
              type="date"
              value={n.date.replace(/\./g,'-')}
              onChange={e => update(i,'date', e.target.value.replace(/-/g,'.'))}
              className="w-full text-xs border border-gray-300 rounded-lg px-2 py-1.5 mb-2"
            />
            <textarea
              rows={3}
              placeholder="한국어 공지 내용"
              value={n.ko}
              onChange={e => update(i,'ko',e.target.value)}
              className="w-full text-xs border border-gray-300 rounded-lg px-2 py-1.5 mb-2 resize-none"
            />
            <textarea
              rows={3}
              placeholder="베트남어 공지 내용 (Nội dung thông báo tiếng Việt)"
              value={n.vi}
              onChange={e => update(i,'vi',e.target.value)}
              className="w-full text-xs border border-gray-300 rounded-lg px-2 py-1.5 resize-none"
            />
          </div>
        ))}

        <button onClick={addNotice} className="w-full border-2 border-dashed border-blue-300 text-blue-500 font-bold text-sm py-2.5 rounded-xl mb-3 tap">
          + 공지 추가
        </button>
        <button
          onClick={() => { onSave(list); onClose(); }}
          className="w-full bg-blue-700 text-white font-black py-3 rounded-xl tap"
        >
          저장하기
        </button>
      </div>
    </div>
  );
}

/* ── 관리자 비밀번호 입력 모달 ── */
function AdminPwModal({ onSuccess, onClose }) {
  const [pw, setPw] = useState('');
  const [err, setErr] = useState(false);

  function check() {
    if (pw === ADMIN_PW) { onSuccess(); }
    else { setErr(true); setPw(''); }
  }

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center px-6" onClick={onClose}>
      <div className="absolute inset-0 bg-black/50" />
      <div className="relative bg-white rounded-2xl p-6 w-full max-w-xs fade-in" onClick={e => e.stopPropagation()}>
        <h3 className="text-base font-black text-gray-800 mb-1 text-center">관리자 확인</h3>
        <p className="text-xs text-gray-400 text-center mb-4">비밀번호를 입력하세요</p>
        <input
          type="password"
          value={pw}
          onChange={e => { setPw(e.target.value); setErr(false); }}
          onKeyDown={e => e.key === 'Enter' && check()}
          placeholder="비밀번호"
          className={`w-full border-2 rounded-xl px-3 py-2.5 text-sm text-center mb-1 outline-none ${err ? 'border-red-400' : 'border-gray-300 focus:border-blue-500'}`}
          autoFocus
        />
        {err && <p className="text-xs text-red-500 text-center mb-2">비밀번호가 틀렸습니다.</p>}
        <div className="flex gap-2 mt-3">
          <button onClick={onClose} className="flex-1 border border-gray-300 text-gray-600 font-bold py-2.5 rounded-xl text-sm tap">취소</button>
          <button onClick={check} className="flex-1 bg-blue-700 text-white font-bold py-2.5 rounded-xl text-sm tap">확인</button>
        </div>
      </div>
    </div>
  );
}

/* ── 메인 NoticeSection ── */
function NoticeSection({ lang }) {
  const [notices, setNotices] = useState(() => loadNotices());
  const [idx, setIdx] = useState(0);
  const [detail, setDetail] = useState(null);      // 상세 보기 중인 공지
  const [showPw, setShowPw] = useState(false);      // 비밀번호 모달
  const [showAdmin, setShowAdmin] = useState(false); // 관리자 편집 모달
  const [tapCount, setTapCount] = useState(0);       // 숨겨진 관리자 접근용 (카운터 5번)
  const tapTimer = useRef(null);

  useEffect(() => {
    if (notices.length === 0) return;
    const t = setInterval(() => {
      setIdx(i => (i + 1) % notices.length);
    }, 4000);
    return () => clearInterval(t);
  }, [notices.length]);

  function handleBannerClick() {
    setDetail(notices[idx]);
  }

  /* 날짜 표시 5번 탭 → 관리자 모달 (숨겨진 접근) */
  function handleCounterTap() {
    setTapCount(c => {
      const next = c + 1;
      clearTimeout(tapTimer.current);
      if (next >= 5) {
        setShowPw(true);
        return 0;
      }
      tapTimer.current = setTimeout(() => setTapCount(0), 2000);
      return next;
    });
  }

  function handleAdminSave(updated) {
    const cleaned = updated.filter(n => n.ko.trim() || n.vi.trim());
    saveNotices(cleaned);
    setNotices(cleaned);
    setIdx(0);
  }

  if (notices.length === 0) return null;
  const n = notices[idx];

  return (
    <>
      <div
        className="bg-blue-700 px-4 py-2.5 flex items-center gap-2.5 cursor-pointer active:bg-blue-800 transition-colors"
        onClick={handleBannerClick}
      >
        <span className={`flex-shrink-0 text-[9px] font-black px-1.5 py-0.5 rounded-full ${n.urgent ? 'bg-yellow-400 text-blue-800' : 'bg-blue-500 text-white'}`}>
          {n.urgent ? '🔴 중요' : '📢 공지'}
        </span>
        <p className="flex-1 text-[11px] text-white font-medium truncate word-keep">
          {n[lang]}
        </p>
        <span
          className="flex-shrink-0 text-[10px] text-blue-300 font-bold select-none"
          onClick={e => { e.stopPropagation(); handleCounterTap(); }}
        >
          {idx + 1}/{notices.length}
        </span>
      </div>

      {detail && (
        <NoticeDetailModal
          notice={detail}
          lang={lang}
          onClose={() => setDetail(null)}
        />
      )}
      {showPw && (
        <AdminPwModal
          onSuccess={() => { setShowPw(false); setShowAdmin(true); }}
          onClose={() => setShowPw(false)}
        />
      )}
      {showAdmin && (
        <NoticeAdminModal
          notices={notices}
          lang={lang}
          onSave={handleAdminSave}
          onClose={() => setShowAdmin(false)}
        />
      )}
    </>
  );
}

/* ── 비자 여정 시각화 섹션 ── */
function VisaTreeSection({ lang, visaType, onChangeType }) {
  const tree = VISA_TREES[visaType];
  const [currentStep, setCurrentStep] = useState(() => localStorage.getItem(VISA_STEP_STORE) || null);

  function tapStep(id) {
    const next = currentStep === id ? null : id;
    setCurrentStep(next);
    if (next) localStorage.setItem(VISA_STEP_STORE, next);
    else localStorage.removeItem(VISA_STEP_STORE);
  }

  function stepState(stepId, allSteps) {
    if (!currentStep) return 'future';
    const currentIdx = allSteps.findIndex(s => s.id === currentStep);
    const thisIdx    = allSteps.findIndex(s => s.id === stepId);
    if (currentIdx === -1) return 'future';
    if (thisIdx < currentIdx)  return 'done';
    if (thisIdx === currentIdx) return 'current';
    return 'future';
  }

  function StepNode({ step, state }) {
    const isDone    = state === 'done';
    const isCurrent = state === 'current';
    return (
      <button onClick={() => tapStep(step.id)} className="flex flex-col items-center gap-1.5 flex-shrink-0 w-[62px] tap">
        <div className={`w-[56px] h-11 rounded-xl flex items-center justify-center border-2 transition-all
          ${isDone    ? 'bg-green-500 border-green-400 text-white' :
            isCurrent ? `${tree.color} border-transparent text-white shadow-md ring-2 ${tree.ring}` :
                        'bg-gray-100 border-gray-200 text-gray-500'}`}>
          {isDone
            ? <span className="text-base font-black">✓</span>
            : <span className={`text-[10px] font-black leading-tight text-center px-1 ${step.final ? 'text-[11px]' : ''}`}>{step.code}</span>}
        </div>
        <p className={`text-[9px] font-bold text-center leading-tight
          ${isCurrent ? tree.text : isDone ? 'text-green-600' : 'text-gray-400'}`}>
          {lang==='vi' ? step.vi : step.ko}
        </p>
      </button>
    );
  }

  const allStepIds = [
    ...tree.steps,
    ...(tree.branches ? tree.branches.flatMap(b => b.steps) : [])
  ];

  return (
    <section className="mt-3 px-3">
      <div className="bg-white rounded-2xl shadow-sm overflow-hidden">
        {/* 헤더 */}
        <div className={`px-4 py-2.5 ${tree.light} border-b border-gray-100 flex items-center justify-between`}>
          <div className="flex items-center gap-2">
            <span className="text-lg">{tree.icon}</span>
            <div>
              <p className={`text-xs font-black ${tree.text}`}>{tree.label[lang==='vi'?'vi':'ko']}</p>
              <p className="text-[9px] text-gray-400">{lang==='vi' ? '← Nhấn vào bước để đánh dấu giai đoạn hiện tại' : '← 현재 단계 탭해서 표시'}</p>
            </div>
          </div>
          <button onClick={onChangeType} className={`text-[10px] font-bold px-2.5 py-1 rounded-full border ${tree.text} border-current tap`}>
            {lang==='vi' ? '변경' : '변경'}
          </button>
        </div>

        {/* 노드 트리 */}
        <div className="px-3 py-3 overflow-x-auto" style={{scrollbarWidth:'none'}}>
          {/* 일반 루트 (worker / student): 가로 스크롤 */}
          {!tree.branches && (
            <div className="flex items-start gap-1 min-w-max">
              {tree.steps.map((step, i) => (
                <React.Fragment key={step.id}>
                  <StepNode step={step} state={stepState(step.id, allStepIds)} />
                  {i < tree.steps.length - 1 && (
                    <span className="text-gray-300 text-sm self-center flex-shrink-0 mt-[-10px]">›</span>
                  )}
                </React.Fragment>
              ))}
            </div>
          )}

          {/* 결혼 루트: F-6 + 분기 2가지 */}
          {tree.branches && (
            <div className="flex items-center gap-2">
              <StepNode step={tree.steps[0]} state={stepState(tree.steps[0].id, allStepIds)} />
              <span className="text-gray-300 text-sm flex-shrink-0">›</span>
              <div className="flex flex-col gap-2">
                {tree.branches.map(branch => (
                  <div key={branch.label.ko} className="flex items-center gap-1.5">
                    <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded-full ${tree.light} ${tree.text} flex-shrink-0`}>
                      {branch.label[lang==='vi'?'vi':'ko']}
                    </span>
                    {branch.steps.map(s => (
                      <StepNode key={s.id} step={s} state={stepState(s.id, allStepIds)} />
                    ))}
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* 지름길 안내 (student) */}
          {tree.shortcut && (
            <p className={`text-[9px] ${tree.text} mt-2 px-1 font-bold word-keep`}>{tree.shortcut[lang==='vi'?'vi':'ko']}</p>
          )}
        </div>

        {/* 하단 메모 */}

    tip: { ko:'🚨 E-7-1은 \'맞춤형\' 비자입니다. 학위+전공+직무+임금이 모두 정렬되어야 합니다. 특히 한국인 5명 이상 회사, GNI 80% 이상 임금, 명확한 고용사유서가 3대 핵심입니다. 다른 비자와 달리 심사관의 출입국 실사 및 기업 전화확인이 매우 엄격합니다. 한국 대학 졸업자는 경력 면제와 직무 일치도에서 엄청난 유연성(특혜)을 얻으니 최대한 활용하세요!', vi:'🚨 E-7-1 là visa \'thiết kế vừa vặn\'. Bằng cấp + chuyên ngành + công việc + lương phải khớp tất cả. Đặc biệt: công ty ≥5 Hàn + lương ≥80% GNI + \'Lý do tuyển dụng\' rõ ràng = 3 cốt lõi. Không như visa khác, cục XNC kiểm tra công ty & gọi điện xác nhân VÔ CÙNG NGHIÊM. Tốt nghiệp ĐH Hàn được miễn kinh nghiệm & linh hoạt ghép nối công việc (ưu đãi lớn) — tận dụng tối đa!' },
  },

    steps: [
      { ko:'[3가지 기본 요건의 엄격한 확인] ①체류 경력: 최근 10년 이내 최소 4년 이상 동일 사업장 합법 근무 (비수도권 3년 특례) ②미래 고용계약: 신청일 기준 현 사업장과 최소 2년 이상 연봉 2,600만원 이상 정식 계약서 필수 ③과거 소득 증빙: 세무서 발급 소득금액증명원상 최근 2년 연평균 2,500만원 이상 필수 (1원 미달도 탈락)', vi:'[3 yêu cầu cơ bản kiểm tra nghiêm ngặt] ①Kinh nghiệm: ≥4 năm làm cùng chỗ (đặc lệ 3 năm địa phương) ②Hợp đồng tương lai: ≥2 năm, ≥2,6 tỷ/năm bắt buộc ③Chứng minh thu nhập: Xác nhận từ cục thuế 2 năm trung bình ≥25 triệu (1 won thiếu = rớt)' },
      { ko:'[한국어 능력 필수 기준] TOPIK 2급 또는 KIIP 2단계 이수 필수. 3급/3단계 이상이면 배점 우대. 한국 대학 재학 중 한국어 과목 이수도 인정되므로 최대한 확보하세요. 2026년 12월 31일까지 한국어 외 점수 150점 이상이면 조건부 우선 승인 가능', vi:'[Tiêu chuẩn tiếng Hàn bắt buộc] TOPIK 2 hoặc KIIP bậc 2 bắt buộc. Cấp 3/bậc 3 lên → được ưu tiên. Học tiếng Hàn ở ĐH Hàn cũng được công nhân. Đến 31/12/2026, ≥150đ ngoài tiếng Hàn → ưu tiên có điều kiện' },
      { ko:'[한국 학위 가산점 전략] 한국 전문대 졸업 (전문학사 10점) 또는 한국 4년제 대학 졸업 (학사 15점) = 엄청난 우대. 고졸이던 사람도 한국에서 대학 입학해 학위 따면 고득점 사다리 가능! 본국 학위는 점수에 영향 없으므로 한국 학위 확보에 집중', vi:'[Chiến lược điểm bằng cấp Hàn Quốc] Cao đẳng Hàn (10đ) hoặc đại học Hàn (15đ) = ưu tiên lớn. Tốt nghiệp cấp 3 vào ĐH Hàn lấy bằng → thang điểm cao! Bằng nước ngoài không ảnh hưởng nên tập trung vào bằng Hàn' },
      { ko:'[2026년 지자체 가산점 치트키] 비수도권(서울·경기·인천 제외) 및 정부 지정 인구감소지역의 제조업체에서 1년 이상 근무한 근로자는 최대 20점의 지자체 가산점 추가! 지방 일자리로 한국 경제 활성화에 기여하는 우대 혜택', vi:'[Điểm tỉnh 2026 là vàng thời gian] Làm ở địa phương (ngoài Seoul/Gyeonggi/Incheon) hay vùng suy thoái được định sẵn, ≥1 năm → +20 điểm! Ưu đãi cho việc làm địa phương kích hoạt kinh tế' },
      { ko:'[부처 추천서 30점 = 합격의 열쇠] 고용노동부·중소벤처기업부·산업통상자원부·광역지자체 추천서를 고용주를 통해 확보하면 최대 30점의 가산점! 이것이 200점 커트라인을 넘기는 가장 확실한 방법. 부처 추천 쿼터 활용하면 선발 확률이 압도적으로 상승', vi:'[Thư giới thiệu 30 điểm = chìa khóa đậu] Xin thư từ MOLITS/SME/MOIT/Tỉnh TP qua chủ → +30đ! Cách chắc chắn nhất để vượt 200đ. Dùng hạn ngạch giới thiệu → xác suất tăng vọt' },

      { ko:'[동반가족 초청 특혜 F-3] E-7-4 자격을 정상 유지하는 근로자는 본국의 배우자와 21세 미만 자녀를 F-3 동반 비자로 합법 초청하여 한국에서 함께 거주 가능! 동반가족도 취업 활동에 제약이 없음 (F-3는 취업 자유)', vi:'[Ưu đãi mời gia đình F-3] Khi giữ E-7-4 bình thường, có thể mời vợ/chồng và con dưới 21 tuổi vào F-3 sống chung tại Hàn! Gia đình F-3 cũng có thể làm việc tự do (F-3 không hạn chế)' },

    tip: { ko:'🚨 [E-7-4 합격과 유지의 3대 핵심] ① 소득금액증명원상 평균 2,500만원 1원 미달 = 100% 탈락 (세전/후 구분 없음, 순수 세무 기록만 인정) ② 준법성 깨끗함 필수 (벌금, 세금, 체납, 출입국법 위반 확인) ③ 부처 추천서 30점 + 한국 학위 + 지자체 가산점 = 240점 이상 확보가 합격의 필수 조건! 💡 이중으로 중요: 신청 당시 소득이 기준을 넘겨도, 매번 연장할 때마다 그 기준을 계속 유지해야 합니다! ⭐ 가장 흔한 탈락 사이클: 첫 신청은 성공했으나 다음 연장 때 소득이 떨어지거나 세금을 미납하면 즉시 탈락 → 재신청 길 막힘. 철저한 소득 관리와 세무 투명성이 장기 비자 유지의 필수!', vi:'🚨 [3 cốt lõi để đậu & giữ E-7-4] ① Xác nhận từ thuế <25 triệu 1 won = tự động rớt (không phân biệt trước/sau thuế, chỉ theo hồ sơ thuế) ② Hành vi sạch (không phạt, không nợ, không vi phạm XNC) ③ Thư giới thiệu 30đ + bằng Hàn + tỉnh = ≥240đ bắt buộc! 💡 Quan trọng kép: lần đầu đủ tiêu chuẩn, lần gia hạn tiếp theo vẫn phải đủ! ⭐ Lỗi tự tử: đậu lần 1 nhưng gia hạn lần 2 lương giảm hoặc nợ thuế → bị từ chối, không được nộp lại. Quản lý lương & minh bạch thuế là must!' },

    steps: [
      { ko:'[신청 자격의 3년 vs 즉시 관문] ①일반: E-7-4 취득 후 한국에서 3년 이상 연속 합법 체류 필수 ②고소득 우대: 전년도 소득금액증명원상 연간 소득 4,000만원 이상 증명 시 3년 제한 없이 E-7-4 직후 즉시 신청 가능! (자신의 소득 수준 먼저 확인 필수)', vi:'[Điều kiện nộp: 3 năm vs ngay lập tức] ①Thường: E-7-4 rồi ≥3 năm ở liên tục ②Lương cao: Xác nhận ≥40 triệu/năm → xin ngay! (kiểm tra lương của mình trước)' },
      { ko:'[학위 공백 메우기 핵심 전략] 국내 대학 졸업장 없는 순수 현장 베테랑들은 ①본국 학력(고졸/전문대 2~10점) ②한국 제조업 장기 근속 경력 점수 ③나이 점수 를 최대한 영끌하여 총 80점 커트라인 달성! 국내 학위가 없어도 경력과 나이로 충분히 역전 가능', vi:'[Chiến lược bù học vấn] Lao động sản xuất không có bằng ĐH Hàn: ①Bằng nước ngoài(2~10đ) ②Điểm kinh nghiệm dài ở sản xuất Hàn ③Điểm tuổi = ≥80đ! Không bằng Hàn cũng được nếu kinh nghiệm & tuổi cao' },
      { ko:'[2026년 소득 기준 철저 이해] F-2-7 신청 시 반드시 전년도(2025년) 한국 국민총소득(GNI) 1배 이상의 소득을 국세청 발행 소득금량증명원으로 입증해야 함. 2026년 현재 대략 연봉 4,400만~4,500만원 선 이상 필수! (정확한 GNI 수치는 출입국청 공고 확인)', vi:'[Tiêu chuẩn thu nhập 2026 hiểu rõ] Bắt buộc chứng minh 2025 thu nhập ≥GNI 1x bằng xác nhận từ cục thuế. 2026 khoảng 44~45 triệu/năm tối thiểu! (kiểm tra GNI chính thức từ XNC)' },

    steps: [

      { ko:'[경로 1 자격: 소득 또는 자산] ①소득 기준: 전년도(2025년) GNI 2배 이상 연간 소득을 소득금액증명원으로 증명 ②자산 대체: 소득이 기준 미달하면 본인 명의 국내 순자산이 가구당 평균 순자산의 1.5배 이상임을 증빙하면 됨 (자산으로 소득 미달 커버 가능!)', vi:'[Điều kiện đường 1: Thu nhập hoặc tài sản] ①Lương: ≥2× GNI thông qua xác nhận cục thuế ②Tài sản: Nếu lương thiếu, tài sản riêng ≥1.5× tài sản trung bình hộ gia đình được phép! (bù lương bằng tài sản)' },
      { ko:'[경로 2: F-5-1 일반 영주권 + 소득합산 특혜] E-7-4·F-2-7 등 전문직 자격으로 한국에서 "연속 5년 이상" 합법 체류한 경우 신청 가능 (제조업 베테랑의 가장 현실적 경로)', vi:'[Đường 2: F-5-1 thông thường + cộng lương] ≥5 năm ở liên tục với visa chuyên môn (con đường thực tế nhất của sản xuất)' },
      { ko:'[경로 2 핵심: 생계를 함께하는 가족 소득 합산 허용] F-5-1은 일반적으로 GNI 2배 소득이 기준이지만, 베트남에서 초청한 배우자(또는 동거 부모·성인 자녀)가 한국에서 합법적으로 일해 얻은 소득을 합산 가능! ①합산 조건: 신청자 본인 소득은 최소 GNI 1배 이상 필수 ②배우자 소득 추가: 베트남 배우자가 제조업이나 타 업종에서 합법 취업해 얻은 소득 합산 ③최종 GNI 2배 달성: 본인+배우자 합산으로 GNI 2배 넘으면 승인! (맞벌이 가정의 폭발적 혜택)', vi:'[Cốt lõi đường 2: Cộng thu nhập gia đình] F-5-1 GNI 2× nhưng được cộng lương vợ/chồng (hoặc cha mẹ/con người lớn) sống chung! ①Điều kiện: Bản thân ≥GNI 1× ②Cộng vợ: Vợ Việt sống tại Hàn, làm việc hợp pháp (sản xuất hoặc ngành khác) → lương vợ cộng vào ③Tổng GNI 2× = duyệt! (gia đình hai thu nhập = ưu thế khổng lồ)' },
      { ko:'[영주권 공통 필수: 영주용 종합평가] F-5-16·F-5-1·F-5-11 모두 해당 — 단순 KIIP 5단계나 거주비자 연장과 달리, 반드시 "영주용 종합평가 시험"에 응시하여 60점 이상 합격증을 제출해야 함. 이것이 없으면 소득·자산이 완벽해도 영주권 신청 자격 자체가 없음!', vi:'[Bắt buộc cho tất cả: Đánh giá tổng hợp cho thường trú] F-5-16/F-5-1/F-5-11 đều phải → không chỉ KIIP 5, mà bắt buộc "thi đánh giá tổng hợp thường trú" ≥60đ. Không có chứng chỉ này = không được nộp dù lương/tài sản chuẩn!' },
      { ko:'[원천 탈락 조건 (절대 금지)] 다음 중 하나라도 해당하면 즉시 불허 처분 — ①불법체류 이력 3개월 이상 ②세금(국세·지방세) 또는 건강보험료 단 하루라도 체납한 기록이 신청 시점에 있음 ③신청 5년 내 음주운전·신호위반 등 벌금형/범칙금 처분 받은 자는 최소 5~10년 대기 필수', vi:'[Điều kiện tự động từ chối (tuyệt đối)] Một trong những điều sau = bị từ chối ngay — ①Quá hạn 3+ tháng ②Nợ thuế/bảo hiểm dù 1 ngày ③Trong 5 năm bị phạt giao thông/say rượu → chờ 5~10 năm mới được xin' },
      { ko:'[2026 전국구 로컬 우대 정책] 정부 지정 인구감소지역(지방 소멸 위험 지역) 산단에서 장기 근무하는 베테랑 근로자의 경우, 영주권 소득 기준을 대폭 완화해주는 특혜 시행 중 — GNI 2배 요건을 GNI 1.5배 또는 1배로 낮춰줌. 지방 산업 발전 & 외국인 정착을 동시에 지원하는 핵심 정책!', vi:'[Ưu đãi 2026 toàn bộ vùng địa phương] Vùng dân số giảm (suy thoái) → tiêu chuẩn GNI giảm: GNI 2× → 1.5× hoặc 1×! Chính sách lõi: hỗ trợ vùng + lao động + định cư!' },

    tip: { ko:'🚨 [제조업 베테랑 F-5 선택 전략] ①F-5-16 (3년 경로): F-2-7 3년만 있으면 되지만, 개인 소득이 GNI 2배 또는 자산 1.5배 필요 ②F-5-1 (5년 경로): 시간이 좀 걸리지만, 배우자 소득 합산으로 GNI 2배를 훨씬 쉽게 달성 가능 → 맞벌이 가정에 최고의 선택! 💡 [소득 합산의 최강 혜택] 제조업 남편(기본급 3,000만원) + 베트남 아내(제조업 2,000만원) = 5,000만원으로 충분히 GNI 2배 통과! 베트남 가족들의 맞벌이 문화를 최대 활용하는 가장 현실적인 경로. ⚠️ [품행단정 폭탄] 영주권 신청 전 반드시 확인할 것: 과거 5년 내 교통 벌금/음주운전/비자 갱신 연체 등이 하나라도 있으면 5~10년 더 기다려야 함! ⭐ [지방 일자리 우대] 비수도권 인구감소지역 산단에서 일하면 소득 기준이 GNI 2배 → 1배로 반으로 줄어드는 정부 혜택 활용!', vi:'🚨 [Chiến lược chọn F-5 sản xuất] ①F-5-16 (3 năm): F-2-7 3 năm thôi nhưng cần ≥2× GNI hoặc tài sản 1.5× ②F-5-1 (5 năm): Chờ lâu hơn nhưng cộng lương vợ → dễ hơn nhiều = tuyệt vời cho gia đình hai thu nhập! 💡 [Vàng thỏi cộng lương] Chồng sản xuất 30 triệu + vợ sản xuất 20 triệu = 50 triệu duyệt GNI 2× dễ dàng! Tận dụng thói quen gia đình Việt hai người làm. ⚠️ [Bom phẩm hành] Trước khi nộp F-5, kiểm tra: phạt giao thông, nợ thuế, quên gia hạn visa? → Chờ 5~10 năm thêm! ⭐ [Ưu đãi điểm] Làm ở vùng dân số giảm → GNI 2× giảm còn 1× = duyệt dễ gấp đôi!' },

  f5_marriage: {

    summary:   { ko:'F-6 결혼이민 2년 후 신청 — GNI 1배 + 가족 소득 합산 + 자산 대체 (가장 파격적 혜택)', vi:'Sau F-6 2 năm → GNI 1× + cộng lương gia đình + bù tài sản (ưu đãi nhất)' },

    target:    { ko:'결혼이민의 최종 목표 💕 — 한국 영구 정착, 배우자와 함께 안정적 거주권',        vi:'Mục tiêu cuối cùng kết hôn 💕 — Định cư vĩnh viễn cùng vợ/chồng' },
    steps: [
      { ko:'[F-6에서 출발: 2년 체류 요건] F-6(결혼이민) 자격을 취득한 날로부터 대한민국에서 연속 2년 이상 합법 체류해야 신청 자격 획득. 이 기간 동안 배우자와 정상적인 혼인 관계를 유지하고 있어야 함 (혼인 진정성 검증 필수)', vi:'[Khởi hành từ F-6: 2 năm ở] Từ ngày nhận F-6, ở liên tục ≥2 năm với hôn nhân bình thường (kiểm tra tính thực)' },
      { ko:'[혼인 단절 시 특례 경로] 한국인 배우자의 사망·실종 또는 배우자의 전적 귀책(가정폭력 등)으로 이혼하게 되었더라도, 국내 체류 정당성이나 미성년 자녀 양육 사실이 증명되면 F-6-2(자녀양육) 또는 F-6-3(혼인단절)에서 직접 F-5-2로 진입 가능! (법원 판결문 등으로 외국인 무과실 입증 필수)', vi:'[Ngoại lệ hôn nhân đứt] Vợ/chồng chết/mất tích hoặc ly hôn vì lỗi chồng (bạo lực...) → F-6-2/F-6-3 có thể xin F-5-2 ngay! (cần phán quyết tòa)' },
      { ko:'[2026년 소득 기준: GNI 1배 (최파격적!)] 신청일 기준 전년도(2025년) 한국 GNI 1배 이상 증명 필수. 약 4,400만~4,500만원 선 이상. 일반 영주권(GNI 2배)의 정확히 절반이므로 결혼이민자에게 가장 파격적인 혜택!', vi:'[Tiêu chuẩn lương 2026: GNI 1× (ưu đãi nhất!)] ≥1× GNI trước (≈44-45 triệu won). GNI 2×(F-5-1) còn lại nửa → ưu đãi tuyệt vời nhất!' },
      { ko:'[★핵심 무기: 가족 소득 합산 전폭 허용] F-5-2의 가장 강력한 장점! 외국인 배우자 본인 소득이 기준 미달해도 OK. 주민등록등본상 함께 살며 생계를 같이하는 한국인 배우자 소득 100% + 직계가족(부모·성인 자녀) 소득도 합산 가능! 예) 남편(2천만원) + 아내(2천만원) + 시어머니(1천만원) = 5천만원 = GNI 1배 충족!', vi:'[★Vàng thỏi: Cộng lương gia đình toàn bộ] Sức mạnh lớn nhất F-5-2! Lương bản thân thiếu cũng OK. Cộng 100% vợ/chồng + cha mẹ + con lớn! VD: Chồng 20M + vợ 20M + mẹ chồng 10M = 50M = đủ!' },
      { ko:'[자산 대체 기준: 소득 미달 시 최후 보루] 부부의 합산 소득이 GNI 1배에 미달해도, 신청자 또는 배우자 명의의 토지·건물·전세보증금·예적금 등 순자산 합계가 전년도 가구당 평균 순자산 이상이면 소득 기준을 100% 대체 가능! (자산이 풍부하면 소득은 낮아도 됨)', vi:'[Bù tài sản: Lá chắn cuối cùng] Lương cộng thiếu GNI 1×, nhưng tài sản (nhà đất, tiền gửi, bảo chứng) ≥tài sản trung bình hộ → được duyệt! (tài sản nhiều = lương ít cũng OK)' },
      { ko:'[필수: 한국어 능력 증명] F-6 신청 시 자녀 있거나 임신으로 한국어 면제받았더라도, F-5 영주권 신청 시는 반드시 한국어 능력을 증명해야 함. 사회통합프로그램(KIIP) 5단계 이수증 또는 영주용 종합평가 합격증(60점 이상) 필수 제출!', vi:'[Bắt buộc: Chứng minh tiếng Hàn] Dù F-6 được miễn tiếng Hàn (vì con/thai), nhưng F-5 xin phải có KIIP 5 hoặc tổng hợp ≥60đ bắt buộc!' },
      { ko:'[영주증 갱신 및 재입국 의무] ①영주 자격은 평생이지만, 신분증(영주증)은 10년마다 출입국에서 반드시 갱신 필수 (미갱신 시 과태료) ②한국을 떠나 해외 체류 시 반드시 2년 이내에 한국으로 재입국해야 영주권 유지 (2년 초과 시 자동 박탈!) ③장기 해외 체류 필요 시 사전에 반드시 "재입국 허가"를 출입국에서 받아야 자격 박탈 방지 가능', vi:'[Gia hạn thẻ & bắt buộc về] ①Tư cách vĩnh viễn nhưng thẻ phải gia hạn mỗi 10 năm (quên = phạt) ②Sống nước ngoài phải về Hàn trong 2 năm (quá 2 năm = hủy tự động!) ③Cần ở nước ngoài lâu → xin phép "tái nhập cảnh" trước' },

  house:  { ko:'🏠 집 구하기 & 쉐어하우스', vi:'Tìm nhà & Share house',   desc_ko:'부동산 정보공유, 질문&답변 등을 하실 수 있는 게시판입니다.',            desc_vi:'Chia sẻ thông tin bất động sản, hỏi đáp thuê phòng.',          cats:['house'],  writeParam:'house'  },

  { id:'n1', title:'[공지] 개인정보 절대 입력 금지 — 닉네임은 자동 익명 생성됩니다.', title_vi:'[Thông báo] Tuyệt đối không nhập thông tin cá nhân — Biệt danh ẩn danh tự động.', date:'25-01-10', views:8820, likes:45 },
  { id:'n2', title:'[공지] 비방·욕설·허위정보 게시글은 즉시 삭제됩니다.',             title_vi:'[Thông báo] Bài đăng có ngôn ngữ xúc phạm hoặc thông tin sai sẽ bị xóa ngay.',    date:'25-01-23', views:20083, likes:33 },

const LOCKED_CAT_INFO = {
  talk:   { e:'🟢', ko:'자유 토크방',       vi:'Góc Tán Gẫu',           desc_ko:'비자 외 일상·자유 수다', desc_vi:'Tán gẫu tự do' },
  travel: { e:'📸', ko:'여행·맛집 소개',    vi:'Du lịch & Ẩm thực',     desc_ko:'여행 정보, 맛집 소개',   desc_vi:'Chia sẻ du lịch, ẩm thực' },
  market: { e:'🥕', ko:'당근마켓 꿀매물',   vi:'Chợ Daangn',            desc_ko:'중고거래, 나눔, 꿀매물', desc_vi:'Mua bán đồ cũ' },

/* ── 클래식 테이블 게시판 ── */
function ClassicBoardPage({ boardKey, nav, posts, lang, onAddComment, onDeleteComment, onUpdateComment, onDeletePost, deviceId }) {
  const cfg = CLASSIC_BOARD_CFG[boardKey];
  if (!cfg) { nav({page:'home'}); return null; }

  const [search,       setSearch]       = useState('');
  const [page,         setPage]         = useState(1);
  const [filterSido,   setFilterSido]   = useState('');
  const [filterSigungu,setFilterSigungu]= useState('');
  const PER_PAGE = 10;
  const hasLocFilter = ['market','house','travel'].includes(boardKey);

  const boardPosts = posts.filter(p => {
    if (!cfg.cats.includes(p.cat) || p.isPublic === false) return false;
    if (hasLocFilter && filterSido    && p.location?.sido    !== filterSido)    return false;
    if (hasLocFilter && filterSigungu && p.location?.sigungu !== filterSigungu) return false;
    return true;
  });
  const filtered = search.trim()
    ? boardPosts.filter(p =>
        p.title.toLowerCase().includes(search.toLowerCase()) ||
        p.body.toLowerCase().includes(search.toLowerCase()))
    : boardPosts;

  const totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
  const pagePosts  = filtered.slice((page-1)*PER_PAGE, page*PER_PAGE);

  function fakeViews(p) {
    const s = typeof p.id === 'number' ? p.id : parseInt(p.id)||1;
    return ((s * 23 + 7) % 180) + 15;
  }
  function fmtDate(d) {
    return (d||'').replace(/^20(\d\d)\.(\d\d)\.(\d\d)$/, '$1-$2-$3');
  }

  const title = lang==='vi' ? cfg.vi  : cfg.ko;
  const desc  = lang==='vi' ? cfg.desc_vi : cfg.desc_ko;

  /* 페이지 번호 배열 계산 */
  const pageNums = (() => {
    const start = Math.max(1, Math.min(page-2, totalPages-4));
    return Array.from({length: Math.min(5, totalPages)}, (_, i) => start + i).filter(p => p <= totalPages);
  })();

  return (
    <div style={{background:'#F5F6F8', minHeight:'100vh'}}>
      {/* 헤더 */}
      <header className="bg-white border-b border-gray-200 sticky top-0 z-40">
        <div className="max-w-2xl mx-auto px-4 h-12 flex items-center justify-between">
          <div className="flex items-center gap-2">
            <button onClick={()=>nav({page:'home'})}
              className="w-7 h-7 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-500 text-xl leading-none tap">‹</button>
            <p className="text-sm font-black text-gray-800">{title}</p>
          </div>
          {/* ❌ 주소 복사 버튼 제거됨 (게시글에서만 사용) */}
        </div>
      </header>

      <div className="max-w-2xl mx-auto px-3 pt-3 pb-24">
        {/* 설명 */}
        <div className="bg-white border border-gray-200 px-4 py-2.5 mb-2 rounded">
          <p className="text-xs text-blue-600 word-keep">{desc}</p>
        </div>

        {/* ── 지역 필터 (market·house·travel만) ── */}
        {hasLocFilter && (
          <div className="bg-white border border-gray-200 rounded mb-2 px-3 py-2.5">
            <div className="flex items-center gap-1.5 mb-2">
              <span className="text-sm">📍</span>
              <p className="text-[11px] font-black text-gray-700">
                {lang==='vi' ? 'Lọc theo khu vực' : '지역 필터'}
              </p>
              {(filterSido || filterSigungu) && (
                <button
                  onClick={()=>{ setFilterSido(''); setFilterSigungu(''); setPage(1); }}
                  className="ml-auto text-[10px] font-black text-red-500 bg-red-50 border border-red-200 px-2 py-0.5 rounded-full tap">
                  ✕ {lang==='vi'?'Xóa bộ lọc':'필터 초기화'}
                </button>
              )}
            </div>
            <div className="flex gap-2">
              {/* 시/도 */}
              <select
                value={filterSido}
                onChange={e=>{ setFilterSido(e.target.value); setFilterSigungu(''); setPage(1); }}
                className={`flex-1 border-2 rounded-xl px-2.5 py-2 text-xs focus:outline-none transition
                  ${filterSido ? 'border-blue-400 bg-blue-50 text-blue-800 font-bold' : 'border-gray-200 text-gray-500'}`}>
                <option value="">{lang==='vi'?'전체 시/도':'전체 시/도'}</option>
                {Object.keys(KOREA_REGIONS).map(r=>(
                  <option key={r} value={r}>{SIDO_SHORT[r]||r}</option>
                ))}
              </select>
              {/* 구/군 */}
              <select
                value={filterSigungu}
                onChange={e=>{ setFilterSigungu(e.target.value); setPage(1); }}
                disabled={!filterSido}
                className={`flex-1 border-2 rounded-xl px-2.5 py-2 text-xs focus:outline-none transition
                  ${!filterSido ? 'border-gray-100 bg-gray-50 text-gray-300' : filterSigungu ? 'border-blue-400 bg-blue-50 text-blue-800 font-bold' : 'border-gray-200 text-gray-500'}`}>
                <option value="">{lang==='vi'?'전체 구/군':'전체 구/군'}</option>
                {filterSido && KOREA_REGIONS[filterSido]?.map(g=>(
                  <option key={g} value={g}>{g}</option>
                ))}
              </select>
            </div>
            {/* 현재 필터 표시 */}
            {(filterSido || filterSigungu) && (
              <p className="text-[11px] font-black text-blue-600 mt-2">
                📍 {SIDO_SHORT[filterSido]||filterSido}{filterSigungu ? ` ${filterSigungu}` : ''} 글만 보는 중
                <span className="text-gray-400 font-normal ml-1">({filtered.length}개)</span>
              </p>
            )}
          </div>
        )}

        {/* 테이블 */}
        <div className="bg-white border border-gray-200 rounded overflow-hidden">
          {/* 헤더 행 */}
          <div className="hidden sm:grid bg-gray-50 border-b-2 border-gray-300 text-[11px] font-black text-gray-500 px-3 py-2.5"
            style={{gridTemplateColumns:'3.5rem 1fr 5rem 4.5rem 3.5rem 3rem'}}>
            <span className="text-center">{lang==='vi'?'STT':'번호'}</span>
            <span className="pl-2">{lang==='vi'?'Tiêu đề':'제목'}</span>
            <span className="text-center">{lang==='vi'?'Tác giả':'작성자'}</span>
            <span className="text-center">{lang==='vi'?'Ngày':'날짜'}</span>
            <span className="text-center">{lang==='vi'?'Xem':'조회'}</span>
            <span className="text-center">{lang==='vi'?'Thích':'추천'}</span>
          </div>
          {/* 모바일 헤더 */}
          <div className="sm:hidden grid bg-gray-50 border-b-2 border-gray-300 text-[11px] font-black text-gray-500 px-3 py-2"
            style={{gridTemplateColumns:'3rem 1fr 4rem 3.5rem'}}>
            <span className="text-center">{lang==='vi'?'STT':'번호'}</span>
            <span className="pl-1">{lang==='vi'?'Tiêu đề':'제목'}</span>
            <span className="text-center">{lang==='vi'?'Tác giả':'작성자'}</span>
            <span className="text-center">{lang==='vi'?'Xem':'조회'}</span>
          </div>

          {/* 공지 */}
          {BOARD_NOTICES.map(n => (
            <React.Fragment key={n.id}>
              {/* 데스크탑 공지 */}
              <div className="hidden sm:grid border-b border-gray-100 px-3 py-2.5 hover:bg-gray-50 cursor-pointer transition"
                style={{gridTemplateColumns:'3.5rem 1fr 5rem 4.5rem 3.5rem 3rem'}}>
                <span className="text-[10px] font-black text-gray-500 text-center self-center">공지</span>
                <p className="text-[12px] font-black text-gray-800 self-center pl-2 word-keep truncate">
                  {lang==='vi' ? n.title_vi : n.title}
                </p>
                <span className="text-[10px] font-bold text-gray-600 text-center self-center">관리자</span>
                <span className="text-[10px] text-gray-400 text-center self-center">{n.date}</span>
                <span className="text-[10px] text-gray-500 text-center self-center">{n.views.toLocaleString()}</span>
                <span className="text-[10px] font-bold text-gray-500 text-center self-center">{n.likes}</span>
              </div>
              {/* 모바일 공지 */}
              <div className="sm:hidden grid border-b border-gray-100 px-3 py-2.5 hover:bg-gray-50 cursor-pointer transition"
                style={{gridTemplateColumns:'3rem 1fr 4rem 3.5rem'}}>
                <span className="text-[9px] font-black text-gray-500 text-center self-center">공지</span>
                <p className="text-[11px] font-black text-gray-800 self-center pl-1 word-keep truncate">
                  {lang==='vi' ? n.title_vi : n.title}
                </p>
                <span className="text-[10px] text-gray-500 text-center self-center">관리자</span>
                <span className="text-[10px] text-gray-500 text-center self-center">{n.views.toLocaleString()}</span>
              </div>
            </React.Fragment>
          ))}

          {/* 일반 게시글 */}
          {pagePosts.length === 0 ? (
            <div className="py-14 text-center text-sm text-gray-400">
              {lang==='vi' ? 'Chưa có bài viết.' : '게시글이 없습니다.'}
            </div>
          ) : pagePosts.map((p, i) => {
            const num   = filtered.length - ((page-1)*PER_PAGE) - i;
            const cmts  = p.commentsData?.length || p.comments || 0;
            const views = fakeViews(p);
            const total = (p.likes||0)+(p.hearts||0)+(p.wows||0);
            const isHot = total >= 10 || cmts >= 10;
            return (
              <React.Fragment key={p.id}>
                {/* 데스크탑 행 */}
                <div
                  onClick={()=>nav({page:'postDetail', boardKey, postId:p.id})}
                  className={`hidden sm:grid border-b border-gray-100 last:border-0 px-3 py-2.5 cursor-pointer transition
                    ${isHot ? 'hover:bg-blue-50 bg-blue-50/20' : 'hover:bg-gray-50 bg-white'}`}
                  style={{gridTemplateColumns:'3.5rem 1fr 5rem 4.5rem 3.5rem 3rem'}}>
                  <span className="text-[11px] text-gray-400 text-center self-center">{num}</span>
                  <div className="pl-2 min-w-0 self-center">
                    <div className="flex items-center gap-1.5">
                      {p.location?.sido && (
                        <span className="text-[8px] font-black text-blue-600 bg-blue-50 border border-blue-200 px-1.5 py-0.5 rounded-full flex-shrink-0 whitespace-nowrap">
                          📍{fmtLocation(p.location)}
                        </span>
                      )}
                      <p className={`text-[12px] truncate word-keep flex-1 ${isHot?'font-bold text-blue-700':'text-gray-700'}`}>{p.title}</p>
                      {p.images?.length > 0 && <span className="text-[10px] flex-shrink-0" title="사진 있음">📷</span>}
                      {cmts > 0 && <span className="text-[10px] text-blue-400 font-bold flex-shrink-0">💬 {cmts}</span>}
                      {p.isNew && <span className="text-[8px] font-black text-white bg-red-500 px-1.5 py-0.5 rounded-full flex-shrink-0">N</span>}
                    </div>
                  </div>
                  <span className="text-[10px] text-gray-500 text-center self-center truncate px-1">{safeAuthor(p).replace(/ #\d+$/,'')}</span>
                  <span className="text-[10px] text-gray-400 text-center self-center">{fmtDate(p.date)}</span>
                  <span className="text-[10px] text-gray-500 text-center self-center">{views}</span>
                  <span className={`text-[10px] text-center self-center font-bold ${total>0?'text-blue-600':'text-gray-300'}`}>{total||0}</span>
                </div>
                {/* 모바일 행 */}
                <div
                  onClick={()=>nav({page:'postDetail', boardKey, postId:p.id})}
                  className={`sm:hidden grid border-b border-gray-100 last:border-0 px-3 py-2.5 cursor-pointer transition
                    ${isHot ? 'hover:bg-blue-50 bg-blue-50/20' : 'hover:bg-gray-50 bg-white'}`}
                  style={{gridTemplateColumns:'3rem 1fr 4rem 3.5rem'}}>
                  <span className="text-[10px] text-gray-400 text-center self-center">{num}</span>
                  <div className="pl-1 min-w-0 self-center">
                    <div className="flex items-center gap-1">
                      <p className={`text-[11px] truncate word-keep flex-1 ${isHot?'font-bold text-blue-700':'text-gray-700'}`}>{p.title}</p>
                      {cmts > 0 && <span className="text-[9px] text-blue-400 font-bold flex-shrink-0">💬{cmts}</span>}
                      {p.isNew && <span className="text-[7px] font-black text-white bg-red-500 px-1 py-0.5 rounded-full flex-shrink-0">N</span>}
                    </div>
                    <span className="text-[9px] text-gray-400">{fmtDate(p.date)}</span>
                  </div>
                  <span className="text-[9px] text-gray-500 text-center self-center truncate px-0.5">{safeAuthor(p).replace(/ #\d+$/,'')}</span>
                  <span className="text-[9px] text-gray-500 text-center self-center">{views}</span>
                </div>
              </React.Fragment>
            );
          })}
        </div>

        {/* 하단: 검색 + 페이지네이션 + 글쓰기 */}
        <div className="flex items-center justify-between mt-3 gap-2 flex-wrap">
          {/* 검색 */}
          <div className="flex items-center border border-gray-300 rounded bg-white px-2.5 py-2 gap-1.5">
            <input
              type="search"
              value={search}
              onChange={e=>{ setSearch(e.target.value); setPage(1); }}
              placeholder={lang==='vi'?'Tìm kiếm':'검색'}
              className="text-xs outline-none w-24 text-gray-700 placeholder-gray-300 bg-transparent"
            />
            <span className="text-gray-400 text-sm">🔍</span>
          </div>

          {/* 페이지네이션 */}
          <div className="flex items-center gap-1">
            {page > 1 && (
              <button onClick={()=>setPage(p=>p-1)}
                className="text-[11px] text-gray-600 bg-white border border-gray-300 px-2.5 h-7 rounded tap hover:bg-gray-50">
                {lang==='vi'?'Trước':'이전'}
              </button>
            )}
            {pageNums.map(p=>(
              <button key={p} onClick={()=>setPage(p)}
                className={`w-7 h-7 rounded text-[11px] font-bold tap transition
                  ${page===p ? 'bg-blue-600 text-white shadow-sm' : 'bg-white border border-gray-300 text-gray-600 hover:bg-gray-50'}`}>
                {p}
              </button>
            ))}
            {page < totalPages && (
              <button onClick={()=>setPage(p=>Math.min(p+1,totalPages))}
                className="text-[11px] text-gray-600 bg-white border border-gray-300 px-2.5 h-7 rounded tap hover:bg-gray-50">
                {lang==='vi'?'Sau':'다음'}
              </button>
            )}
          </div>

          {/* 글쓰기 */}
          <button onClick={()=>nav({page:'write', param:cfg.writeParam})}
            className="bg-blue-600 text-white text-xs font-black px-4 py-2 rounded tap hover:bg-blue-700 transition shadow-sm">
            {lang==='vi'?'Viết bài':'글쓰기'}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── 게시글 상세 페이지 ── */
function PostDetailPage({ boardKey, postId, nav, posts, lang, onAddComment, onDeleteComment, onUpdateComment, onDeletePost, onEditPost, deviceId }) {
  const post = posts.find(p => p.id === postId || p.id === Number(postId));
  const cfg  = CLASSIC_BOARD_CFG[boardKey];

  const [r,        setR]        = useState({ likes:post?.likes||0, hearts:post?.hearts||0, wows:post?.wows||0 });
  const [act,      setAct]      = useState(null);
  const [lightbox, setLightbox] = useState(null);
  const [shareModal, setShareModal] = useState(false);
  const [shareMsg, setShareMsg] = useState('');
  const lbTouchX = useRef(null);

  // post 변경 시 반응수 동기화
  useEffect(() => {
    if (post) {
      setR({ likes: post.likes||0, hearts: post.hearts||0, wows: post.wows||0 });
    }
  }, [post?.id, post?.likes, post?.hearts, post?.wows]);

  // Open Graph 메타 태그 설정
  useEffect(() => {
    if (post) {
      const title = post.title || '게시글';
      const description = (post.body || '').substring(0, 150).replace(/<[^>]*>/g, '') || cfg?.ko || '';
      const url = `${window.location.origin}${window.location.pathname}#/postDetail/${boardKey}/${postId}`;

      document.title = title;

      // og:title
      let ogTitle = document.querySelector('meta[property="og:title"]');
      if (!ogTitle) {
        ogTitle = document.createElement('meta');
        ogTitle.setAttribute('property', 'og:title');
        document.head.appendChild(ogTitle);
      }
      ogTitle.setAttribute('content', title);

      // og:description
      let ogDesc = document.querySelector('meta[property="og:description"]');
      if (!ogDesc) {
        ogDesc = document.createElement('meta');
        ogDesc.setAttribute('property', 'og:description');
        document.head.appendChild(ogDesc);
      }
      ogDesc.setAttribute('content', description);

      // og:url
      let ogUrl = document.querySelector('meta[property="og:url"]');
      if (!ogUrl) {
        ogUrl = document.createElement('meta');
        ogUrl.setAttribute('property', 'og:url');
        document.head.appendChild(ogUrl);
      }
      ogUrl.setAttribute('content', url);
    }
  }, [post?.id, post?.title, post?.body, boardKey, postId]);

  if (!post) return (
    <div className="flex items-center justify-center min-h-screen">
      <div className="text-center px-6">
        <p className="text-3xl mb-3">📭</p>
        <p className="text-gray-400 text-sm mb-4">{lang==='vi'?'Không tìm thấy bài viết.':'게시글을 찾을 수 없습니다.'}</p>
        <button onClick={()=>nav({page:'classicBoard', param:boardKey})}

/* ── 실시간 핫 전광판 (관리자 편집 포함) ── */
function TickingAnnouncementBar({ lang }) {
  const [notices,   setNotices]   = useState(() => loadNotices());
  const [idx,       setIdx]       = useState(0);
  const [showPw,    setShowPw]    = useState(false);
  const [showAdmin, setShowAdmin] = useState(false);
  const [tapCount,  setTapCount]  = useState(0);
  const tapTimer = useRef(null);

  useEffect(() => {
    if (notices.length === 0) return;
    const t = setInterval(() => setIdx(i => (i+1) % notices.length), 3500);
    return () => clearInterval(t);
  }, [notices.length]);

  function handleSave(updated) {
    const cleaned = updated.filter(n => n.ko?.trim() || n.vi?.trim());
    saveNotices(cleaned);
    setNotices(cleaned);
    setIdx(0);
  }

  if (notices.length === 0) return null;
  const n = notices[idx];

  return (
    <>
      <div
        className="bg-yellow-400 px-4 py-2 cursor-pointer"
        onClick={() => {
          setTapCount(c => {
            const next = c + 1;
            clearTimeout(tapTimer.current);
            if (next >= 5) { setShowPw(true); return 0; }
            tapTimer.current = setTimeout(() => setTapCount(0), 2000);
            return next;
          });
        }}>
        <p className="text-[9px] font-black text-yellow-900/60 leading-none mb-0.5">
          ⚡ {lang==='vi' ? 'Bảng thông báo thời gian thực' : '실시간 핫 한 줄 전광판'}
        </p>
        <p className="text-[11px] font-bold text-yellow-900 word-keep leading-relaxed overflow-hidden"
          style={{height:'3.4em', maxHeight:'3.4em', display:'-webkit-box', WebkitLineClamp:2, WebkitBoxOrient:'vertical'}}>
          🔥 {n[lang]}
        </p>
      </div>

      {/* 비밀번호 모달 */}
      {showPw && (
        <AdminPwModal
          onSuccess={() => { setShowPw(false); setShowAdmin(true); }}
          onClose={() => setShowPw(false)}
        />
      )}
      {/* 편집 모달 */}
      {showAdmin && (
        <NoticeAdminModal
          notices={notices}
          lang={lang}
          onSave={handleSave}
          onClose={() => setShowAdmin(false)}
        />
      )}
    </>
  );
}

  sos:    { key:'d9',     emoji:'📘', bg:'bg-blue-600',   ko:'비자 정보',   vi:'Visa' },

};

function HotFeed({ posts, nav, lang }) {
  const BOARD_LOOKUP = {};
  BOARD_HOT_CFG.forEach(b => b.cats.forEach(c => { BOARD_LOOKUP[c] = b; }));

  function ageDays(p) {
    try { return Math.max(0, (Date.now() - new Date((p.date||'').replace(/\./g,'-')).getTime()) / 86400000); }
    catch { return 999; }
  }

  /* 실시간 랭킹: 참여도 × 시간 가중치 */
  const hotItems = [...posts]
    .filter(p => p.isPublic !== false && p.title && p.id && p.cat)
    .map(p => {
      const d   = ageDays(p);
      const eng = (p.likes||0)+(p.hearts||0)+(p.wows||0) + (p.commentsData?.length||p.comments||0)*2;
      const mult = d <= 1 ? 3.0 : d <= 7 ? 1.8 : d <= 30 ? 1.2 : 1.0;
      return { ...p, _sc: eng * mult, _age: d };
    })
    .sort((a,b) => b._sc - a._sc)
    .slice(0, 10)
    .map(p => {
      const boardInfo = BOARD_LOOKUP[p.cat] || BOARD_HOT_CFG[2];
      return { post: p, ...boardInfo };
    });

  return (
    <section className="mt-3 px-3">
      <div className="bg-white rounded-t-2xl px-4 py-3 border-b border-gray-100">
        <div className="flex items-center justify-between">
          <div>
            <p className="text-sm font-black text-gray-800">
              🔥 {lang==='vi' ? 'Bài viết hot' : '실시간 인기글'}
            </p>
            <p className="text-[10px] text-gray-400 mt-0.5">
              {lang==='vi'
                ? '24h mới × 3 · Tự giảm theo thời gian'
                : '24시간 신규 글 ×3 가중 · 시간이 지날수록 자연 감소'}
            </p>
          </div>
          <span className="text-[10px] font-black text-orange-500 bg-orange-50 border border-orange-200 px-2.5 py-1 rounded-full">
            {lang==='vi' ? '🔥 LIVE' : '🔥 실시간'}
          </span>
        </div>
      </div>

      <div className="bg-white rounded-b-2xl overflow-hidden shadow-sm">
        {hotItems.length === 0 ? (
          <div className="py-12 text-center text-gray-400 text-sm">
            {lang==='vi' ? 'Chưa có bài viết nào.' : '아직 게시글이 없어요.'}
          </div>
        ) : hotItems.map((item, i) => {
          const p     = item.post;

function LatestFeed({ posts, nav, lang }) {

    .filter(p => p.isPublic !== false && p.title && p.id)
    .sort((a, b) => {
      const aDate = (a.date||'').replace(/\./g, '-');

      return new Date(bDate).getTime() - new Date(aDate).getTime();

    <section className="mt-3 px-3 pb-4">
